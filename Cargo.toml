[workspace]
members = ["third_party/bcw"]
resolver = "2"

[package]
name = "prym-phi"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Finite-field geometry and deformation stages for the Prym–Green computations"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
