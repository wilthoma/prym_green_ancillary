[package]
name = "prym-bcw"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Exact block Wiedemann rank lower bounds for the Prym–Green computations"

[[bin]]
name = "prym-rank"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
nalgebra = "0.33.2"
rayon = "1.7"
num-traits = "0.2.19"
rand = "0.9.0"
bubblemath = "0.1"
num = "0.4.3"
zstd = "0.13"
